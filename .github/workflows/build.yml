name: Build

on:
  pull_request:
  push:
    branches:
      - main
      - "tagivy/beta-*"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # The app builds against the macOS 27 SDK, which only the Xcode 27 image provides.
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
      - name: Check project invariants
        run: ruby script/check_invariants.rb
      - name: Build and test Tagivy
        run: >-
          xcodebuild
          -project VideoTagManager.xcodeproj
          -scheme VideoTagManager
          -configuration Debug
          -destination 'platform=macOS'
          -derivedDataPath .build/DerivedData
          -resultBundlePath .build/TestResults.xcresult
          CODE_SIGNING_ALLOWED=NO
          test
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: .build/TestResults.xcresult
          retention-days: 7
